plugins {
    id 'com.android.application'
}

android {
    namespace 'com.duocam.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.duocam.app"
        minSdk 30
        targetSdk 31
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
